name: Deploy Automatico na VPS Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar atualização via SSH na VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /root/RETSYS-New
            git pull origin main

            # Injeta as chaves do GitHub no arquivo .env da VPS
            cat << 'EOF' > .env
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REDIRECT_URI=https://wo-retsys.tech/api/spotify/callback
            EOF

            # Subir os containers no Docker
            docker compose up -d --build
            docker image prune -f

            # Copiar a configuração do Nginx do Git para a VPS
            cp /root/RETSYS-New/nginx/wo-retsys.tech /etc/nginx/sites-available/wo-retsys.tech
            ln -sf /etc/nginx/sites-available/wo-retsys.tech /etc/nginx/sites-enabled/
            nginx -t && systemctl reload nginx